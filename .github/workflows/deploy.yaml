name: Deploy to Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        run: | 
          source ~/.nvm/nvm.sh
          nvm use 22
            
      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Deploy with PM2
        run: |
          pm2 delete cfc-site || true
          pm2 start pm2.json